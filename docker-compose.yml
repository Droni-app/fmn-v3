services:
  build-assets:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - dist_data:/output
    environment:
      BASE_PATH: /
    command: >
      sh -c "npm ci && npm run build && rm -rf /output/* && cp -r dist/. /output/"

  web:
    image: nginx:1.27-alpine
    depends_on:
      build-assets:
        condition: service_completed_successfully
    ports:
      - '8080:80'
    volumes:
      - dist_data:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  dist_data:
